# CI: lint, type-check, test and build every push and pull request.
# CD: pushes to main deploy the site and the live-drawing relay to the server
#     (same steps as scripts/deploy.sh). Can also be run by hand from the Actions tab.
#
# Deploys happen only where these are set (Settings → Secrets and variables → Actions):
#   variable DEPLOY_HOST          user@address
#   variable DEPLOY_KNOWN_HOSTS   the server's line for known_hosts (pinned, not trusted on first use)
#   variable SITE_URL             https://…, to check the deploy arrived
#   secret   DEPLOY_SSH_KEY       private half of a key in the server's ~/.ssh/authorized_keys
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check app and relay
        run: npm run typecheck
      - name: Test the relay and moderation
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    if: vars.DEPLOY_HOST != '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: SSH key + pinned host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
      - name: Deploy site
        run: SKIP_BUILD=1 DEPLOY_HOST="$HOST" DEPLOY_KEY=~/.ssh/deploy bash scripts/deploy.sh
      - name: Update live-drawing relay (restart only if it changed)
        run: |
          # -c: compare contents (a fresh checkout gives every file a new timestamp)
          changed=$(rsync -aic -e "ssh -i ~/.ssh/deploy" server shared "$HOST:/home/ubuntu/streetview-realtime/" | grep -v '^\.' || true)
          if [ -n "$changed" ]; then
            echo "$changed"
            # dependencies changed: install them (sharp for previews, ws)
            if echo "$changed" | grep -q 'server/relay.package.json'; then
              ssh -i ~/.ssh/deploy "$HOST" 'cd /home/ubuntu/streetview-realtime && cp server/relay.package.json package.json && PATH=/opt/node/bin:$PATH npm install --omit=dev --no-audit --no-fund'
            fi
            ssh -i ~/.ssh/deploy "$HOST" 'sudo systemctl restart streetview-realtime && sleep 2 && systemctl is-active streetview-realtime'
          else
            echo "relay unchanged"
          fi
      - name: Check the live site serves this build
        run: |
          want=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          got=$(curl -fsS "$SITE_URL/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          echo "built $want, live $got"
          [ "$want" = "$got" ]
          # the panorama photos aren't in git: make sure the deploy brought them along
          type=$(curl -fsS -o /dev/null -w '%{content_type}' "$SITE_URL/panorama-pool/ph-colosseum-card.jpg")
          echo "photo check: $type"
          [ "$type" = "image/jpeg" ]
