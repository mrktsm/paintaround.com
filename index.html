  <!-- before the app's CSS loads: no white flash -->
  <style>html, body { background: #09090b; }</style>
  <script>
    // opened from the home screen (iPhones report it as navigator.standalone)
    if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
  </script>
  <script>
    // Fix iOS Safari viewport height — uses visualViewport API with debounced fallback
    (function () {
      var timeout;
      function getHeight() {
        if (window.visualViewport) return window.visualViewport.height;
        return window.innerHeight;
      }
      function setAppHeight() {
        document.documentElement.style.setProperty('--app-height', getHeight() + 'px');
      }
      function debouncedSetAppHeight() {
        clearTimeout(timeout);
        timeout = setTimeout(setAppHeight, 100);
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', debouncedSetAppHeight);
      }
      window.addEventListener('resize', debouncedSetAppHeight);
      window.addEventListener('orientationchange', function () {
        setTimeout(setAppHeight, 300);
      });
      setAppHeight();
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
